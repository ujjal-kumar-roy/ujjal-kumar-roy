name: Redraw profile

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.json
      - scripts/**
      - .github/workflows/redraw.yml

permissions:
  contents: write

concurrency:
  group: redraw-profile
  cancel-in-progress: true

jobs:
  redraw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - run: python scripts/build.py
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}

      - name: Commit the redrawn cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          if git diff --cached --quiet; then
            echo "Cards unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "chore: redraw profile cards"
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin main && git push && exit 0
            sleep $((attempt * 10))
          done
          exit 1
